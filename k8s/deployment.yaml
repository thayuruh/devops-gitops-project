apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-gitops-app
spec:
  replicas: 2

  selector:
    matchLabels:
      app: devops-gitops-app

  template:
    metadata:
      labels:
        app: devops-gitops-app

    spec:
      containers:
        - name: devops-gitops-app
          image: ghcr.io/thayuruh/devops-gitops-project:latest

          ports:
            - containerPort: 8081
